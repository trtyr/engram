name: engram

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: ${POSTGRES_DB:-engram}
    volumes:
      # 数据存宿主本地：PG 数据目录 bind mount（Time Machine/手工备份友好）
      - ${ENGRAM_DATA_HOME:-~/.engram}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-engram}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 构建期代理：宿主 Clash TUN 会污染容器直连出网（见文件头注释）。
        # 本机构建传：HTTP_PROXY=http://host.docker.internal:12543（按实际端口改）
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    depends_on:
      db:
        condition: service_healthy
    # 宿主运行 Clash TUN（fake-ip 198.18/15）时容器 DNS 解析被污染，
    # SSRF 防护会正确拒绝 fake-ip 地址。此环境给容器配代理即可恢复外网摄取：
    #   HTTPS_PROXY=http://host.docker.internal:7892（按本机 Clash 端口改）。
    # 常规环境无需任何设置。
    environment:
      AGENT_MEMORY_DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-engram}
      AGENT_MEMORY_PORT: "8080"
      AGENT_MEMORY_ADMIN_PASSWORD: ${AGENT_MEMORY_ADMIN_PASSWORD:?AGENT_MEMORY_ADMIN_PASSWORD 未设置}
      AGENT_MEMORY_MASTER_KEY: ${AGENT_MEMORY_MASTER_KEY:?AGENT_MEMORY_MASTER_KEY 未设置}
      RUST_LOG: ${RUST_LOG:-info}
      # 运行时出网代理（LLM API / URL 摄取）：宿主 Clash TUN fake-ip 会污染容器直连。
      # ~/.engram/.env 里配 HTTPS_PROXY=http://host.docker.internal:<宿主代理端口>，常规环境留空即可。
      HTTP_PROXY: ${HTTPS_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    ports:
      - "${AGENT_MEMORY_PORT:-8080}:8080"
    volumes:
      # 数据存宿主本地：uploads / wiki-sources / codegraph
      - ${ENGRAM_DATA_HOME:-~/.engram}/app:/app/data
      # codegraph 容器形态：注册仓库按 bind mount 挂进容器（路径=容器内路径注册）。
      # 新仓库接入：volumes 加一行挂载 → 容器内 codegraph register source_uri=/workspace/<repo> → index。
      - /Users/trtyr/Documents/sec-agent:/workspace/sec-agent
    restart: unless-stopped

# 数据卷已 bind mount 到宿主 ~/.engram/（见各服务 volumes），不再使用 named volume
