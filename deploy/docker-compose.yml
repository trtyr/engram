name: agent-memory

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: ${POSTGRES_DB:-agent_memory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_memory}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # 宿主运行 Clash TUN（fake-ip 198.18/15）时容器 DNS 解析被污染，
    # SSRF 防护会正确拒绝 fake-ip 地址。此环境给容器配代理即可恢复外网摄取：
    #   HTTPS_PROXY=http://host.docker.internal:7892（按本机 Clash 端口改）。
    # 常规环境无需任何设置。
    environment:
      AGENT_MEMORY_DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_memory}
      AGENT_MEMORY_PORT: "8080"
      AGENT_MEMORY_ADMIN_PASSWORD: ${AGENT_MEMORY_ADMIN_PASSWORD:?AGENT_MEMORY_ADMIN_PASSWORD 未设置}
      AGENT_MEMORY_MASTER_KEY: ${AGENT_MEMORY_MASTER_KEY:?AGENT_MEMORY_MASTER_KEY 未设置}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${AGENT_MEMORY_PORT:-8080}:8080"
    volumes:
      - appdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
