name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: 后端（fmt + clippy + test）
    runs-on: ubuntu-latest
    # 集成测试基建连本机 PG（AM_TEST_PG_URL，每测试建/删 am_test_* 库）。
    # 镜像必须带 pgvector：迁移 0001 在每个测试库里 CREATE EXTENSION vector。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-test-pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AM_TEST_PG_URL: postgres://agent:ci-test-pw@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --check
      # rust-embed 编译期要求 web/dist 存在（占位空目录即可；真产物由 docker/e2e job 构建）
      - name: web/dist 占位
        run: mkdir -p ../web/dist
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    name: 前端（tsc + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build


  # 注（2026-09-22）：原 `api-types` job（openapi-dump → openapi-typescript 生成
  # web/src/lib/api-schema.ts → git diff 漂移检查）已撤除——该生成物是死文件（无任何 import，
  # 前端类型一律手写在 web/src/lib/api.ts）。OpenAPI 契约守护保留在后端 job：
  # `server/crates/api/tests/auth_test.rs::openapi_snapshot` 逐条断言 144 条 path（跑在 test 里）。

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
