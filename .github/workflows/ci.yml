name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: 后端（fmt + clippy + test）
    runs-on: ubuntu-latest
    # 集成测试基建连本机 PG（AM_TEST_PG_URL，每测试建/删 am_test_* 库）。
    # 镜像必须带 pgvector：迁移 0001 在每个测试库里 CREATE EXTENSION vector。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-test-pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AM_TEST_PG_URL: postgres://agent:ci-test-pw@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --check
      # rust-embed 编译期要求 web/dist 存在（占位空目录即可；真产物由 docker/e2e job 构建）
      - name: web/dist 占位
        run: mkdir -p ../web/dist
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    name: 前端（tsc + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build

  api-types:
    name: OpenAPI 类型同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # 从代码提取 openapi.json（不起服务）：编译一个 dump 工具
      - name: dump openapi
        working-directory: server
        run: |
          mkdir -p ../web/dist
          cargo run -q -p engram-api --bin openapi-dump > /tmp/openapi.json
          python3 -c "import json; d=json.load(open('/tmp/openapi.json')); print('paths:', len(d['paths']))"
      - name: generate types + drift check
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec openapi-typescript /tmp/openapi.json -o src/lib/api-schema.ts
          if ! git diff --quiet -- src/lib/api-schema.ts; then
            echo "::error::api-schema.ts 与后端 OpenAPI 漂移——运行 pnpm run gen:api 后提交"
            git diff -- src/lib/api-schema.ts | head -40
            exit 1
          fi

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
