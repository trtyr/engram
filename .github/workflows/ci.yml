name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: 后端（fmt + clippy + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # testcontainers 需要 Docker（ubuntu runner 自带）
      - name: test
        run: cargo test --workspace

  web:
    name: 前端（tsc + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  api-types:
    name: OpenAPI 类型同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # 从代码提取 openapi.json（不起服务）：编译一个 dump 工具
      - name: dump openapi
        working-directory: server
        run: |
          mkdir -p ../web/dist
          cargo run -q -p agent-memory-api --bin openapi-dump > /tmp/openapi.json
          python3 -c "import json; d=json.load(open('/tmp/openapi.json')); print('paths:', len(d['paths']))"
      - name: generate types + drift check
        working-directory: web
        run: |
          npm ci
          npx openapi-typescript /tmp/openapi.json -o src/lib/api-schema.ts
          if ! git diff --quiet -- src/lib/api-schema.ts; then
            echo "::error::api-schema.ts 与后端 OpenAPI 漂移——运行 npm run gen:api 后提交"
            git diff -- src/lib/api-schema.ts | head -40
            exit 1
          fi

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
