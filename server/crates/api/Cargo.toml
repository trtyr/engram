[package]
name = "engram-api"
description = "HTTP 层：路由、handler、DTO、OpenAPI、中间件"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "engram-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
engram-storage.workspace = true
engram-mcp.workspace = true
engram-jobs.workspace = true
engram-llm.workspace = true
engram-core.workspace = true
engram-distill.workspace = true
engram-search.workspace = true
engram-cg-bridge.workspace = true

axum.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["fs"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
rand.workspace = true
zip.workspace = true

[dev-dependencies]
tower.workspace = true
tempfile = "3"
# 测试夹具直连 PG 造数（src 层零 SQL；持久化收口 engram-storage::repo）
sqlx.workspace = true
