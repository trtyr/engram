[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/mcp",
    "crates/storage",
    "crates/llm",
    "crates/jobs",
    "crates/distill",
    "crates/wiki-engine",
    "crates/cg-bridge",
    "crates/search",
    "crates/parsing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trtyr/engram"

[workspace.dependencies]
# 内部 crates
engram-api = { path = "crates/api" }
engram-core = { path = "crates/core" }
engram-mcp = { path = "crates/mcp" }
engram-storage = { path = "crates/storage" }
engram-llm = { path = "crates/llm" }
engram-jobs = { path = "crates/jobs" }
engram-distill = { path = "crates/distill" }
engram-wiki-engine = { path = "crates/wiki-engine" }
engram-cg-bridge = { path = "crates/cg-bridge" }
engram-search = { path = "crates/search" }
engram-parsing = { path = "crates/parsing" }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# 异步运行时与 HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# 可观测
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# API 文档
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

# 工具
uuid = { version = "1", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# MCP（官方 Rust SDK：Streamable HTTP 服务端，宿主于 engram-server /mcp）
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1"

# LLM crate
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.9"

# 文档解析（wiki 文档域）
zip = { version = "2", default-features = false, features = ["deflate"] }  # 技能整包 bundle

# 检索
jieba-rs = "0.4"
pgvector = { version = "0.4", features = ["sqlx"] }

# 文档解析（wiki 文档域）
pdf-extract = "0.12"          # 内部 lopdf ≥0.42（RUSTSEC-2026-0187 修复）
docx-rs = "0.4"
scraper = "0.23"

# 测试

# ---------- 编译性能（2026-09-20 用户反馈「编译太慢」，实测定位）----------
# 本机 8 核 / 8GB：默认 dev profile 的 debug = true 会给**每个依赖**产出完整调试
# 信息，实测 target 达 51GB（deps 33G + incremental 18G）；配合默认并行度（=核数）
# 把内存打爆（swap 用掉 2.96G/4G、空闲物理页仅 ~177MB）→ 编译高峰全在换页。
# line-tables-only 保留行号（回溯定位够用）；依赖直接不带调试信息。
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# thin LTO 每次部署都要跨 crate 全程序优化（分钟级 + 峰值内存）——本项目非计算
# 密集，关闭它换取部署构建速度；strip 保留（省磁盘/安装体积）。
[profile.release]
lto = false
codegen-units = 16
strip = true
